<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Clean登録</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<h2>Clean登録</h2>

<form th:action="@{/clean-regist}" method="POST" th:object="${cleanRegistForm}">

<table class="detail-table">
	<tr>
		<td class="guide">【Clean名】</td>
		<td>
		   	<input type="text" th:field="*{cleanName}"><br>
		   	<div th:if="${#fields.hasErrors('cleanName')}" th:errors="*{cleanName}" class="error-msg"></div>
		</td>
	</tr>
	<tr>
		<td class="guide">【登録日】</td>
		<td>
		   	<input type="date" th:field="*{registDate}"><br>
		   	<div th:if="${#fields.hasErrors('registDate')}" th:errors="*{registDate}" class="error-msg"></div>
		</td>
	</tr>
	<tr>
		<td class="guide">【タイプ】</td>
		<td>
		   	<select th:field="*{typeCode}">
				<option value="">(選択してください)</option>
				<option th:each="type : ${typeList}"
					th:value="${type.typeCode}"
					th:text="${type.typeCode + ':' + type.typeName}">
				</option>
			</select><br>
		   	<div th:if="${#fields.hasErrors('typeCode')}" th:errors="*{typeCode}" class="error-msg"></div>
		</td>
	</tr>
	<tr>
		<td class="guide">【備考】</td>
		<td>
		   	<input type="text" th:field="*{remarks}" class="long"><br>
		   	<div th:if="${#fields.hasErrors('remarks')}" th:errors="*{remarks}" class="error-msg"></div>
		</td>
	</tr>
</table>

<input type="submit" value="登録" class="btn">

</form>

<br>
<a th:href="@{/top}">トップページに戻る</a>

</body>
</html>
